<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextField — preview</title></head>
<body>
<div class="sp-demo sp-demo--form">
  <label class="sp-field"><span class="sp-label">Game title</span><input class="sp-input" id="tf1" value="Moth &amp; Lantern"></label>
  <label class="sp-field"><span class="sp-label">Repo link</span><input class="sp-input" id="tf2" placeholder="https://github.com/you/your-game"><span class="sp-help"><i data-icon="information-fill"></i>Anyone should be able to open it without signing in.</span></label>
  <label class="sp-field sp-field--error"><span class="sp-label">What did you change since last time?</span><textarea class="sp-input" id="tf3">fixed bugs</textarea><span class="sp-help"><i data-icon="warning-fill"></i>Tell us a bit more: at least 40 characters.<span class="sp-count">10 / 40</span></span></label>
</div>
<script>window.SavePoint && SavePoint.mountIcons();</script>
</body>
</html>
