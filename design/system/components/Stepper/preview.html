<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Stepper — preview</title></head>
<body>
<div class="sp-demo sp-demo--col">
  <ol class="sp-steps" aria-label="Getting started">
    <li class="sp-step is-done"><span class="sp-step__dot"><i data-icon="check-fill"></i></span>Pick your game</li>
    <li class="sp-step is-done"><span class="sp-step__dot"><i data-icon="check-fill"></i></span>Link Hackatime</li>
    <li class="sp-step is-current" aria-current="step"><span class="sp-step__dot">3</span>Choose a goal</li>
    <li class="sp-step"><span class="sp-step__dot">4</span>Set your pace</li>
    <li class="sp-step"><span class="sp-step__dot">5</span>Sign</li>
  </ol>
</div>
<script>window.SavePoint && SavePoint.mountIcons();</script>
</body>
</html>
