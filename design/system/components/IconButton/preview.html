<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>IconButton — preview</title></head>
<body>
<div class="sp-demo">
  <button class="sp-btn sp-iconbtn" id="ib1" aria-label="Close"><i data-icon="close-fill"></i></button>
  <button class="sp-btn sp-iconbtn sp-btn--royal" id="ib2" aria-label="Previous prize"><i data-icon="left-fill"></i></button>
  <button class="sp-btn sp-iconbtn sp-btn--royal" id="ib3" aria-label="Next prize"><i data-icon="right-fill"></i></button>
  <button class="sp-btn sp-iconbtn sp-btn--gold" id="ib4" aria-label="Add a Hackatime project"><i data-icon="add-fill"></i></button>
  <button class="sp-btn sp-iconbtn sp-btn--sm" id="ib5" aria-label="More"><i data-icon="more-1-fill"></i></button>
  <button class="sp-btn sp-iconbtn sp-btn--sm" id="ib6" aria-label="Refresh hours"><i data-icon="refresh-2-fill"></i></button>
</div>
<script>window.SavePoint && SavePoint.mountIcons();</script>
</body>
</html>
