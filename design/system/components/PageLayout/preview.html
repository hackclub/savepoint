<!-- @dsCard group="Layout" height=520 -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>PageLayout — preview</title></head>
<body>
<div class="sp-page" style="min-height:520px">
  <div class="sp-container">
    <header class="sp-topbar"><a class="sp-topbar__logo sp-logo-text" href="#">Save Point</a>
      <div class="sp-cluster"><span class="sp-stat"><span class="sp-stat__key"><i data-icon="time-fill"></i></span>6.5<span class="sp-stat__unit">hrs</span></span><button class="sp-btn sp-iconbtn sp-btn--sm" id="pl0" aria-label="Settings"><i data-icon="settings-3-fill"></i></button></div></header>
    <div class="sp-grid" style="padding-top:24px">
      <section class="sp-panel sp-span-8"><h2 class="sp-ribbon"><span><i data-icon="save-2-fill"></i>Your save</span></h2>
        <div class="sp-meter" style="--approved:36%;--pending:18%"><div class="sp-meter__top"><span class="sp-meter__now">6.5 <small>/ 12 hrs</small></span><span class="sp-meter__goal"><i data-icon="keyboard-fill"></i>Goal: Aula F75</span></div>
        <div class="sp-meter__bar"><div class="sp-meter__track"><span class="sp-meter__fill"></span><span class="sp-meter__pending"></span></div><span class="sp-meter__end"><i data-icon="star-fill"></i></span></div></div></section>
      <section class="sp-panel sp-span-4"><h2 class="sp-ribbon sp-ribbon--gold"><span><i data-icon="rocket-fill"></i>Ship</span></h2>
        <p style="margin:0">4 of 7 checks pass.</p><button class="sp-btn sp-btn--royal" id="pl1">Open the checklist</button></section>
    </div>
  </div>
</div>
<script>window.SavePoint && SavePoint.mountIcons();</script>
</body>
</html>
