<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Modal — preview</title></head>
<body>
<div class="sp-scrim">
  <div class="sp-modal" role="dialog" aria-modal="true" aria-labelledby="m-h">
    <button class="sp-btn sp-iconbtn sp-modal__close" id="mc" aria-label="Close"><i data-icon="close-fill"></i></button>
    <div class="sp-modal__head"><h2 id="m-h">Make this your goal?</h2><p>You can change it any time.</p></div>
    <div class="sp-modal__body">
      <div class="sp-cluster"><span class="sp-stat"><span class="sp-stat__key"><i data-icon="keyboard-fill"></i></span>12<span class="sp-stat__unit">hrs</span></span><strong>Aula F75 keyboard</strong></div>
      <p style="margin:0">At your pace that's about 1.1 hrs a day until the end.</p>
      <div class="sp-modal__actions"><button class="sp-btn sp-btn--ghost" id="m1">Not now</button><button class="sp-btn sp-btn--gold" id="m2"><i data-icon="flag-1-fill"></i>Set as my goal</button></div>
    </div>
  </div>
</div>
<script>window.SavePoint && SavePoint.mountIcons();</script>
</body>
</html>
