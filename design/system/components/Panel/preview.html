<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Panel — preview</title></head>
<body>
<div class="sp-demo sp-page" style="padding-top:40px">
  <section class="sp-panel" style="flex:1;min-width:280px">
    <h2 class="sp-ribbon"><span><i data-icon="save-2-fill"></i>Your save</span></h2>
    <p style="margin:0">Moth &amp; Lantern, from the jame gam. Hours count from the day Save Point starts.</p>
    <div class="sp-cluster">
      <span class="sp-stat"><span class="sp-stat__key"><i data-icon="time-fill"></i></span>6.5<span class="sp-stat__unit">hrs</span></span>
      <span class="sp-stat"><span class="sp-stat__key sp-stat__key--bronze"><i data-icon="fire-fill"></i></span>3<span class="sp-stat__unit">day streak</span></span>
    </div>
  </section>
  <section class="sp-panel" style="flex:1;min-width:240px">
    <h2 class="sp-ribbon sp-ribbon--gold"><span><i data-icon="gift-fill"></i>Next prize</span></h2>
    <p style="margin:0">8BitDo Ultimate 2C is 0.5 hrs away.</p>
  </section>
</div>
<script>window.SavePoint && SavePoint.mountIcons();</script>
</body>
</html>
