# The GIFs for each participant DM, shown only while SLACK_GIFS=1 (see SlackGifs). Admin DMs have none. A key with no entry sends no image.
# Keys: nudge.<arm>, reward.<key>, extension.<status>, order.ordered. Each key holds a pool: production picks one at random per message,
# the demo rotates through it. A nudge arm's pool has about one GIF per variant.
# Every GIF is a GIPHY file, at most 3 MB (giphy-downsized where the original was bigger). Slack fetches the url itself, so it must stay public.
# `celebration` is shared by every celebratory message, through the alias below.
